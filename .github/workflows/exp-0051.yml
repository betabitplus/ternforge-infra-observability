name: EXP-0051 Scalr current-run boundary

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SCALR_HOSTNAME: betabitplus-ternforge.scalr.io
  SCALR_SA_EMAIL: ternforge-fleet-health-github@betabitplus-ternforge.scalr.io
  SCALR_CLI_VERSION: 0.18.0
  SCALR_WORKSPACE_ID: ws-v0pc9tb78frfm28ls

jobs:
  prove:
    name: prove recoverable run-status readback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: observability
    steps:
      - name: Install pinned Scalr CLI
        run: |
          set -euo pipefail
          base="https://github.com/Scalr/scalr-cli/releases/download/v${SCALR_CLI_VERSION}"
          archive="scalr-cli_${SCALR_CLI_VERSION}_linux_amd64.zip"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/scalr-cli_${SCALR_CLI_VERSION}_SHA256SUMS"
          grep " ${archive}$" "scalr-cli_${SCALR_CLI_VERSION}_SHA256SUMS" | sha256sum --check --strict
          unzip -q "$archive"
          sudo install -m 0755 scalr /usr/local/bin/scalr
          rm -f "$archive" "scalr-cli_${SCALR_CLI_VERSION}_SHA256SUMS" scalr

      - name: Exchange GitHub OIDC for Scalr credential
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=betabitplus")"
          oidc="$(jq -er '.value' <<<"$response")"
          echo "::add-mask::$oidc"
          scalr -quiet assume-service-account \
            -id-token="$oidc" \
            -service-account-email="$SCALR_SA_EMAIL" \
            -lifetime=600

      - name: Probe run status filters
        run: |
          set -euo pipefail
          scalr -format=json get-runs \
            -filter-workspace="$SCALR_WORKSPACE_ID" \
            -filter-status=pending > pending.json
          printf 'pending_count=%s\n' "$(jq 'length' pending.json)"
          jq -e 'length == 0' pending.json >/dev/null

          set +e
          scalr -format=json get-runs \
            -filter-workspace="$SCALR_WORKSPACE_ID" \
            -filter-status='in:pending,planning,applying' > multi.json 2> multi.err
          multi_rc=$?
          set -e
          printf 'multi_status_rc=%s\n' "$multi_rc"
          cat multi.err
          if test "$multi_rc" -eq 0; then
            printf 'multi_status_count=%s\n' "$(jq 'length' multi.json)"
            jq -e 'length == 0' multi.json >/dev/null
          fi
          rm -f pending.json multi.json multi.err
